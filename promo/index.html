<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Поймай подарок — промо-игра</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://st.max.ru/js/max-web-app.js"></script>
<style>
:root{
  --bg1:#FFF4E8; --bg2:#F6DFC6; --accent:#7A4A2B; --accent2:#C98B4F; --ink:#2A1A10; --ink2:#6E5242; --card:#FFFFFF;
  --btn-ink:#FFFFFF; --gold:#E7B24A;
  --display:'Unbounded',system-ui,sans-serif; --body:'Manrope',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg1);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;transition:background .4s}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--accent2);outline-offset:3px;border-radius:10px}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* HUD */
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 12px) 16px 0;display:flex;gap:8px;align-items:center;justify-content:space-between;pointer-events:none;opacity:0;transition:opacity .3s}
.hud.on{opacity:1}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:999px;padding:8px 14px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;box-shadow:0 6px 16px -8px rgba(0,0,0,.25);color:var(--ink)}
.pill svg{width:18px;height:18px}
.lives{display:flex;gap:3px}
.lives i{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.lives i.off{background:rgba(0,0,0,.15);box-shadow:none}
.timebar{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 60px);height:6px;border-radius:6px;background:rgba(255,255,255,.6);overflow:hidden;opacity:0;transition:opacity .3s}
.timebar.on{opacity:1}
.timebar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:6px;transform-origin:left}

/* Экраны */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);text-align:center;transition:opacity .35s,transform .35s var(--ease)}
.screen.hide{opacity:0;pointer-events:none;transform:scale(.97)}
.panel{width:100%;max-width:400px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:28px;padding:26px 22px 22px;box-shadow:0 30px 60px -30px rgba(0,0,0,.35),inset 0 2px 0 #fff}
.logo{width:76px;height:76px;margin:-64px auto 12px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(160deg,var(--accent2),var(--accent));color:#fff;font-family:var(--display);font-weight:800;font-size:30px;box-shadow:0 14px 26px -10px var(--accent),inset 0 2px 0 rgba(255,255,255,.4)}
.brand{font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
h1{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.05;margin:8px 0 10px;color:var(--ink)}
.lead{font-size:16px;line-height:1.45;color:var(--ink2);max-width:30ch;margin:0 auto}
.rules{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:18px 0 20px}
.rule{background:var(--bg1);border-radius:16px;padding:12px 6px 10px;font-size:12px;font-weight:700;color:var(--ink2);line-height:1.3}
.rule canvas{display:block;margin:0 auto 6px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:999px;font-weight:800;font-size:17px;color:var(--btn-ink);background:linear-gradient(180deg,var(--accent2),var(--accent));box-shadow:0 14px 24px -12px var(--accent),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -4px 8px rgba(0,0,0,.18);transition:transform .15s var(--spring)}
.btn:active{transform:translateY(2px) scale(.97)}
.btn.ghost{background:var(--bg1);color:var(--ink);box-shadow:inset 0 0 0 2px rgba(0,0,0,.06)}
.row{display:flex;gap:10px;margin-top:10px}
.small{font-size:12px;color:var(--ink2);margin-top:12px;opacity:.85}

/* Итог */
.score-big{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;color:var(--accent);margin-top:6px;font-variant-numeric:tabular-nums}
.prize{margin:16px 0 14px;padding:16px;border-radius:20px;background:linear-gradient(160deg,var(--bg1),var(--bg2));border:2px dashed var(--accent2)}
.prize b{display:block;font-family:var(--display);font-size:22px;color:var(--ink);line-height:1.15}
.prize span{display:block;font-size:13px;color:var(--ink2);margin-top:4px;font-weight:700}
.code{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;background:#fff;border-radius:14px;padding:10px 10px 10px 16px}
.code strong{font-family:var(--display);font-size:18px;letter-spacing:.06em;color:var(--ink);white-space:nowrap}
.code button{flex:none;min-height:44px;padding:0 14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;font-size:14px}
.next{font-size:13px;color:var(--ink2);font-weight:700}

/* Демо-переключатель бренда */
.demo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:6px;background:rgba(20,16,12,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:6px;border-radius:999px;z-index:5;transition:opacity .3s}
.demo.hide{opacity:0;pointer-events:none}
.demo span{color:rgba(255,255,255,.7);font-size:12px;font-weight:800;align-self:center;padding:0 6px 0 10px}
.demo button{min-height:40px;min-width:44px;padding:0 12px;border-radius:999px;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px}
.demo button i{width:14px;height:14px;border-radius:50%;display:block;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.demo button[aria-pressed="true"]{background:rgba(255,255,255,.18)}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translate(-50%,-20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;opacity:0;transition:all .25s var(--spring);z-index:10;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="game" aria-label="Игровое поле"></canvas>

<div class="hud" id="hud">
  <div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v9H4v-9M2 7h20v5H2zM12 21V7M12 7H7.5a2.5 2.5 0 1 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 1 0 0-5C13 2 12 7 12 7z"/></svg><span id="score">0</span></div>
  <div class="pill"><div class="lives" id="lives"><i></i><i></i><i></i></div></div>
  <div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg><span id="time">40</span></div>
</div>
<div class="timebar" id="timebar"><i id="timefill"></i></div>

<section class="screen" id="start">
  <div class="panel">
    <div class="logo" id="logo1">З</div>
    <div class="brand" id="brand1">Кофейня «Зерно»</div>
    <h1>Поймай подарок</h1>
    <p class="lead" id="lead">Лови подарки корзиной и собери скидку на следующий визит. Бойся туч!</p>
    <div class="rules">
      <div class="rule"><canvas width="84" height="84" style="width:42px;height:42px" id="r1"></canvas>Подарок<br>+1</div>
      <div class="rule"><canvas width="84" height="84" style="width:42px;height:42px" id="r2"></canvas>Звезда<br>+3</div>
      <div class="rule"><canvas width="84" height="84" style="width:42px;height:42px" id="r3"></canvas>Туча<br>−жизнь</div>
    </div>
    <button class="btn" id="play">Играть</button>
    <p class="small">Води пальцем по экрану — корзина поедет за ним</p>
  </div>
</section>

<section class="screen hide" id="end">
  <div class="panel">
    <div class="logo" id="logo2">З</div>
    <div class="brand" id="endTitle">Отличная игра!</div>
    <div class="score-big" id="finalScore">0</div>
    <div class="next" id="nextTier"></div>
    <div class="prize">
      <span>Ваш приз</span>
      <b id="prizeText">Скидка 5%</b>
      <div class="code"><strong id="promo">ZRN-0000</strong><button id="copy">Копировать</button></div>
      <span id="prizeNote">Покажите код на кассе. Действует 7 дней.</span>
    </div>
    <div class="row">
      <button class="btn ghost" id="again">Ещё раз</button>
    </div>
  </div>
</section>

<nav class="demo" id="demo" aria-label="Демо: сменить бренд">
  <span>Бренд:</span>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
/* =========================================================
   «Поймай подарок» — промо-игра под любой бренд.
   Чтобы перекрасить под клиента, достаточно поменять объект
   в BRANDS: название, буква логотипа, цвета, призы, префикс кода.
   ========================================================= */
const BRANDS = [
  { id:'coffee', name:'Кофейня «Зерно»', short:'Кофейня', letter:'З', code:'ZRN',
    lead:'Лови подарки корзиной и собери скидку на следующий кофе. Бойся туч!',
    colors:{bg1:'#FFF4E8',bg2:'#F6DFC6',accent:'#7A4A2B',accent2:'#C98B4F',ink:'#2A1A10',ink2:'#6E5242',gift1:'#C98B4F',gift2:'#7A4A2B',ribbon:'#FFE6B8',sky:'#FFE9D2'},
    prizes:[{min:0,text:'Скидка 5%'},{min:15,text:'Скидка 10%'},{min:30,text:'Круассан в подарок'},{min:50,text:'Капучино бесплатно'}] },
  { id:'beauty', name:'Салон «Лиса»', short:'Салон', letter:'Л', code:'LISA',
    lead:'Лови подарки и забери скидку на процедуры. Тучи портят настроение!',
    colors:{bg1:'#FFF0F4',bg2:'#F8D5E0',accent:'#A3305B',accent2:'#E0719A',ink:'#3A1325',ink2:'#7D4A5E',gift1:'#E0719A',gift2:'#A3305B',ribbon:'#FFF1C9',sky:'#FFE3EC'},
    prizes:[{min:0,text:'Скидка 5%'},{min:15,text:'Скидка 10% на маникюр'},{min:30,text:'Уход для рук в подарок'},{min:50,text:'Скидка 20% на всё'}] },
  { id:'flowers', name:'Цветы «Пион»', short:'Цветы', letter:'П', code:'PION',
    lead:'Лови подарки и получи скидку на букет. Тучи — к дождю, от них уворачивайся!',
    colors:{bg1:'#F1F8EF',bg2:'#D5EBD0',accent:'#2F6B45',accent2:'#6FB27E',ink:'#152B1D',ink2:'#4B6B55',gift1:'#E77F9B',gift2:'#2F6B45',ribbon:'#FFF6D6',sky:'#E4F3E1'},
    prizes:[{min:0,text:'Скидка 5%'},{min:15,text:'Скидка 10% на букет'},{min:30,text:'Открытка в подарок'},{min:50,text:'Доставка бесплатно'}] }
];
const GAME_TIME = 40, LIVES = 3;

const MAX = window.WebApp || null;
const haptic = t => { try{ MAX?.HapticFeedback?.impactOccurred(t) }catch(e){} };
const hapticN = t => { try{ MAX?.HapticFeedback?.notificationOccurred(t) }catch(e){} };

const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
let brand = BRANDS[0];
try{ const s = localStorage.getItem('promo_brand'); if (s) brand = BRANDS.find(b => b.id === s) || brand; }catch(e){}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  basket.y = H - 110 - Math.max(0, parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sab')) || 0);
  basket.w = Math.min(120, W * .3);
}
const basket = { x: 0, y: 0, w: 110, h: 60, tx: 0, squash: 0 };

function applyBrand(b){
  brand = b;
  const r = document.documentElement.style;
  for (const [k, v] of Object.entries(b.colors)) r.setProperty('--' + k, v);
  $('logo1').textContent = $('logo2').textContent = b.letter;
  $('brand1').textContent = b.name;
  $('lead').textContent = b.lead;
  document.querySelectorAll('.demo button').forEach(x => x.setAttribute('aria-pressed', x.dataset.id === b.id));
  drawRuleIcons();
  try{ localStorage.setItem('promo_brand', b.id) }catch(e){}
}

/* ---------- Рисование объектов ---------- */
function roundRect(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function drawGift(c, x, y, s, rot, cols){
  c.save(); c.translate(x, y); c.rotate(rot);
  const w = s, h = s * .82;
  c.shadowColor = 'rgba(0,0,0,.18)'; c.shadowBlur = s * .25; c.shadowOffsetY = s * .12;
  const g = c.createLinearGradient(-w/2, -h/2, w/2, h/2); g.addColorStop(0, cols.gift1); g.addColorStop(1, cols.gift2);
  c.fillStyle = g; roundRect(c, -w/2, -h/2 + s*.12, w, h, s*.12); c.fill();
  c.shadowColor = 'transparent';
  // крышка
  const lg = c.createLinearGradient(0, -h/2, 0, -h/2 + s*.24); lg.addColorStop(0, 'rgba(255,255,255,.45)'); lg.addColorStop(1, 'rgba(255,255,255,.1)');
  c.fillStyle = cols.gift1; roundRect(c, -w/2 - s*.05, -h/2, w + s*.1, s*.26, s*.08); c.fill();
  c.fillStyle = lg; roundRect(c, -w/2 - s*.05, -h/2, w + s*.1, s*.26, s*.08); c.fill();
  // лента
  c.fillStyle = cols.ribbon; c.fillRect(-s*.08, -h/2, s*.16, h + s*.12);
  // бант
  c.beginPath(); c.ellipse(-s*.17, -h/2 - s*.06, s*.17, s*.1, -.5, 0, Math.PI*2); c.ellipse(s*.17, -h/2 - s*.06, s*.17, s*.1, .5, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(0, -h/2 - s*.03, s*.08, 0, Math.PI*2); c.fill();
  // блик
  c.fillStyle = 'rgba(255,255,255,.35)'; roundRect(c, -w/2 + s*.08, -h/2 + s*.3, s*.12, h*.45, s*.06); c.fill();
  c.restore();
}
function drawStar(c, x, y, s, rot){
  c.save(); c.translate(x, y); c.rotate(rot);
  c.shadowColor = 'rgba(231,178,74,.6)'; c.shadowBlur = s * .5;
  const g = c.createRadialGradient(-s*.1, -s*.15, s*.05, 0, 0, s*.6); g.addColorStop(0, '#FFF3C4'); g.addColorStop(.5, '#F5C94F'); g.addColorStop(1, '#D89A1E');
  c.fillStyle = g; c.beginPath();
  for (let i = 0; i < 10; i++){ const a = -Math.PI/2 + i * Math.PI/5, r = i % 2 ? s*.24 : s*.55; c.lineTo(Math.cos(a)*r, Math.sin(a)*r); }
  c.closePath(); c.fill(); c.restore();
}
function drawCloud(c, x, y, s, t){
  c.save(); c.translate(x, y);
  c.shadowColor = 'rgba(0,0,0,.25)'; c.shadowBlur = s*.2; c.shadowOffsetY = s*.1;
  const g = c.createLinearGradient(0, -s*.4, 0, s*.3); g.addColorStop(0, '#8C94A3'); g.addColorStop(1, '#565D6B');
  c.fillStyle = g; c.beginPath();
  c.arc(-s*.25, 0, s*.26, 0, Math.PI*2); c.arc(0, -s*.14, s*.33, 0, Math.PI*2); c.arc(s*.28, 0, s*.24, 0, Math.PI*2);
  c.rect(-s*.25, 0, s*.53, s*.24); c.fill();
  c.shadowColor = 'transparent';
  // глаза-злючки
  c.fillStyle = '#fff'; c.beginPath(); c.arc(-s*.1, -s*.02, s*.06, 0, Math.PI*2); c.arc(s*.12, -s*.02, s*.06, 0, Math.PI*2); c.fill();
  c.fillStyle = '#1D2230'; c.beginPath(); c.arc(-s*.09, 0, s*.03, 0, Math.PI*2); c.arc(s*.13, 0, s*.03, 0, Math.PI*2); c.fill();
  c.strokeStyle = '#1D2230'; c.lineWidth = s*.03; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-s*.17, -s*.1); c.lineTo(-s*.04, -s*.07); c.moveTo(s*.19, -s*.1); c.lineTo(s*.06, -s*.07); c.stroke();
  // молния
  c.fillStyle = '#FFD84A'; c.beginPath(); c.moveTo(s*.02, s*.24); c.lineTo(-s*.08, s*.44 + Math.sin(t*20)*s*.02); c.lineTo(0, s*.42); c.lineTo(-s*.05, s*.58); c.lineTo(s*.1, s*.36); c.lineTo(s*.03, s*.38); c.closePath(); c.fill();
  c.restore();
}
function drawBasket(c){
  const b = basket, cols = brand.colors;
  const sq = 1 + b.squash * .18, sw = b.w * sq, sh = b.h / sq;
  c.save(); c.translate(b.x, b.y);
  // тень
  c.fillStyle = 'rgba(0,0,0,.12)'; c.beginPath(); c.ellipse(0, sh*.55, sw*.5, 8, 0, 0, Math.PI*2); c.fill();
  // корпус
  const g = c.createLinearGradient(0, -sh/2, 0, sh/2); g.addColorStop(0, cols.accent2); g.addColorStop(1, cols.accent);
  c.fillStyle = g; c.beginPath();
  c.moveTo(-sw/2, -sh/2); c.lineTo(sw/2, -sh/2); c.lineTo(sw*.4, sh/2); c.lineTo(-sw*.4, sh/2); c.closePath(); c.fill();
  // плетение
  c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = 2;
  for (let i = 1; i < 3; i++){ const yy = -sh/2 + i * sh/3; c.beginPath(); c.moveTo(-sw/2 + i*3, yy); c.lineTo(sw/2 - i*3, yy); c.stroke(); }
  // кромка
  c.fillStyle = cols.gift2; roundRect(c, -sw/2 - 6, -sh/2 - 8, sw + 12, 14, 7); c.fill();
  c.fillStyle = 'rgba(255,255,255,.3)'; roundRect(c, -sw/2 - 2, -sh/2 - 6, sw + 4, 4, 2); c.fill();
  // логотип
  c.fillStyle = '#fff'; c.font = `800 ${Math.round(sh*.42)}px Unbounded, system-ui`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(brand.letter, 0, sh*.08);
  c.restore();
}

/* ---------- Фон ---------- */
let bgDots = [];
function makeBg(){ bgDots = Array.from({length: 18}, () => ({x: Math.random(), y: Math.random(), r: 20 + Math.random()*70, s: .2 + Math.random()*.6})); }
function drawBg(t){
  const cols = brand.colors;
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, cols.sky); g.addColorStop(1, cols.bg2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  for (const d of bgDots){ const y = ((d.y * H + t * 12 * d.s) % (H + 200)) - 100; ctx.beginPath(); ctx.arc(d.x * W, y, d.r, 0, Math.PI*2); ctx.fill(); }
  // земля
  ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(W/2, H + 40, W*.9, 120, 0, 0, Math.PI*2); ctx.fill();
}

/* ---------- Состояние игры ---------- */
let state = 'menu', items = [], parts = [], floats = [], score = 0, lives = LIVES, timeLeft = GAME_TIME, spawnT = 0, elapsed = 0, shake = 0, last = 0, bestCombo = 0, combo = 0;

function reset(){
  items = []; parts = []; floats = []; score = 0; lives = LIVES; timeLeft = GAME_TIME; spawnT = 0; elapsed = 0; combo = 0; bestCombo = 0;
  basket.x = basket.tx = W / 2; updateHud();
}
function spawn(){
  const diff = Math.min(1, elapsed / GAME_TIME);
  const r = Math.random();
  const type = r < .2 + diff * .12 ? 'cloud' : r < .3 + diff * .1 ? 'star' : 'gift';
  const s = type === 'cloud' ? 58 : type === 'star' ? 40 : 46;
  items.push({ type, s, x: 30 + Math.random() * (W - 60), y: -50, vy: 150 + Math.random()*60 + diff * 240, vx: (Math.random() - .5) * 30, rot: (Math.random()-.5) * .6, vr: (Math.random()-.5) * 2, t: 0 });
}
function burst(x, y, col, n = 12){
  for (let i = 0; i < n; i++){ const a = Math.random()*Math.PI*2, v = 80 + Math.random()*180; parts.push({x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 120, life: .7, col, s: 3 + Math.random()*4}); }
}
function floatText(x, y, text, col){ floats.push({x, y, text, col, life: .9}); }

function update(dt){
  elapsed += dt; timeLeft -= dt;
  if (timeLeft <= 0){ timeLeft = 0; finish(); return; }
  // корзина плавно за пальцем
  basket.x += (basket.tx - basket.x) * Math.min(1, dt * 16);
  basket.x = Math.max(basket.w/2 + 16, Math.min(W - basket.w/2 - 16, basket.x));
  basket.squash *= Math.pow(.001, dt);
  // спавн
  spawnT -= dt;
  const interval = Math.max(.32, .8 - elapsed * .012);
  if (spawnT <= 0){ spawn(); spawnT = interval * (.7 + Math.random()*.6); }
  // предметы
  for (const it of items){
    it.t += dt; it.y += it.vy * dt; it.x += it.vx * dt + (it.type === 'cloud' ? Math.sin(it.t * 2) * 30 * dt : 0); it.rot += it.vr * dt;
    const top = basket.y - basket.h/2 - 6;
    if (!it.dead && it.y + it.s*.35 >= top && it.y - it.s*.35 <= basket.y + 10 && Math.abs(it.x - basket.x) < basket.w/2 + it.s*.25){
      it.dead = true; basket.squash = 1;
      if (it.type === 'cloud'){
        lives--; combo = 0; shake = .35; haptic('heavy');
        burst(it.x, it.y, '#6B7280', 16); floatText(it.x, it.y - 20, '−жизнь', '#4B5563');
        if (lives <= 0){ updateHud(); finish(); return; }
      } else {
        const pts = it.type === 'star' ? 3 : 1; combo++; bestCombo = Math.max(bestCombo, combo);
        const bonus = combo > 0 && combo % 8 === 0 ? 2 : 0;
        score += pts + bonus; haptic(it.type === 'star' ? 'medium' : 'light');
        burst(it.x, it.y, it.type === 'star' ? '#F5C94F' : brand.colors.gift1, it.type === 'star' ? 18 : 10);
        floatText(it.x, it.y - 20, bonus ? `+${pts} +${bonus} серия!` : `+${pts}`, it.type === 'star' ? '#C58A14' : brand.colors.accent);
      }
      updateHud();
    }
    if (it.y > H + 60){ it.dead = true; if (it.type !== 'cloud') combo = 0; }
  }
  items = items.filter(i => !i.dead);
  for (const p of parts){ p.life -= dt; p.vy += 600*dt; p.x += p.vx*dt; p.y += p.vy*dt; }
  parts = parts.filter(p => p.life > 0);
  for (const f of floats){ f.life -= dt; f.y -= 50*dt; }
  floats = floats.filter(f => f.life > 0);
  shake = Math.max(0, shake - dt);
  $('timefill').style.transform = `scaleX(${timeLeft / GAME_TIME})`;
  const tl = Math.ceil(timeLeft); if ($('time').textContent != tl) $('time').textContent = tl;
}

function render(t){
  ctx.save();
  if (shake > 0){ ctx.translate((Math.random()-.5)*shake*24, (Math.random()-.5)*shake*24); }
  drawBg(t);
  for (const it of items){
    if (it.type === 'gift') drawGift(ctx, it.x, it.y, it.s, it.rot, brand.colors);
    else if (it.type === 'star') drawStar(ctx, it.x, it.y, it.s, it.rot);
    else drawCloud(ctx, it.x, it.y, it.s, t);
  }
  if (state === 'play' || state === 'end') drawBasket(ctx);
  for (const p of parts){ ctx.globalAlpha = Math.max(0, p.life / .7); ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, p.s, p.s); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.font = '800 20px Manrope, system-ui';
  for (const f of floats){ ctx.globalAlpha = Math.min(1, f.life * 2); ctx.fillStyle = f.col; ctx.fillText(f.text, f.x, f.y); }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function loop(ts){
  const t = ts / 1000, dt = Math.min(.05, t - (last || t)); last = t;
  if (state === 'play') update(dt);
  else if (state === 'menu'){ // фон-демо: падают подарки
    spawnT -= dt; if (spawnT <= 0 && items.length < 7){ spawn(); items[items.length-1].vy *= .5; spawnT = .9; }
    for (const it of items){ it.y += it.vy*dt; it.rot += it.vr*dt; it.t += dt; if (it.y > H + 60) it.dead = true; }
    items = items.filter(i => !i.dead);
    for (const p of parts){ p.life -= dt; p.vy += 600*dt; p.x += p.vx*dt; p.y += p.vy*dt; }
    parts = parts.filter(p => p.life > 0); floats = [];
  }
  render(t);
  requestAnimationFrame(loop);
}

/* ---------- HUD и экраны ---------- */
function updateHud(){
  $('score').textContent = score;
  [...$('lives').children].forEach((el, i) => el.classList.toggle('off', i >= lives));
}
function show(id){ ['start','end'].forEach(s => $(s).classList.toggle('hide', s !== id)); }
function start(){
  haptic('medium'); reset(); state = 'play'; items = [];
  show(null); $('hud').classList.add('on'); $('timebar').classList.add('on'); $('demo').classList.add('hide');
}
function prizeFor(s){ let p = brand.prizes[0]; for (const x of brand.prizes) if (s >= x.min) p = x; return p; }
function makeCode(){ const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 4; i++) s += a[Math.floor(Math.random()*a.length)]; return brand.code + '-' + s; }
function finish(){
  if (state !== 'play') return;
  state = 'end'; hapticN('success');
  $('hud').classList.remove('on'); $('timebar').classList.remove('on');
  const p = prizeFor(score), nx = brand.prizes.find(x => x.min > score);
  $('finalScore').textContent = score;
  $('endTitle').textContent = lives <= 0 ? 'Тучи победили, но приз ваш!' : score >= 30 ? 'Вот это улов!' : 'Отличная игра!';
  $('prizeText').textContent = p.text;
  $('promo').textContent = makeCode();
  $('nextTier').textContent = nx ? `Ещё ${nx.min - score} до приза «${nx.text}»` : 'Вы забрали главный приз!';
  setTimeout(() => { show('end'); $('demo').classList.remove('hide'); }, 450);
}

/* ---------- Ввод ---------- */
function pointer(e){ const p = e.touches ? e.touches[0] : e; if (p) basket.tx = p.clientX; }
cv.addEventListener('pointerdown', e => { pointer(e); });
cv.addEventListener('pointermove', e => { if (state === 'play') pointer(e); });
cv.addEventListener('touchmove', e => { e.preventDefault(); pointer(e); }, {passive:false});
addEventListener('keydown', e => {
  if (state !== 'play') return;
  if (e.key === 'ArrowLeft' || e.key === 'a') basket.tx -= 60;
  if (e.key === 'ArrowRight' || e.key === 'd') basket.tx += 60;
});
$('play').onclick = start;
$('again').onclick = start;
$('copy').onclick = async () => {
  const code = $('promo').textContent;
  try{ await navigator.clipboard.writeText(code); toast('Код скопирован'); }
  catch(e){ const r = document.createRange(); r.selectNodeContents($('promo')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Код выделен — скопируйте'); }
  haptic('light');
};
document.addEventListener('visibilitychange', () => { last = 0; });

let tt; function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1800); }

/* ---------- Демо-переключатель ---------- */
const demo = $('demo');
BRANDS.forEach(b => {
  const btn = document.createElement('button');
  btn.dataset.id = b.id; btn.innerHTML = `<i style="background:${b.colors.accent2}"></i>${b.short}`;
  btn.onclick = () => { haptic('soft'); applyBrand(b); if (state === 'end') show('start'), state = 'menu'; toast(`Теперь это «${b.name.split('«')[1].replace('»','')}»`); };
  demo.appendChild(btn);
});

function drawRuleIcons(){
  const r1 = $('r1').getContext('2d'), r2 = $('r2').getContext('2d'), r3 = $('r3').getContext('2d');
  [r1, r2, r3].forEach(c => c.clearRect(0, 0, 84, 84));
  drawGift(r1, 42, 44, 50, -.1, brand.colors); drawStar(r2, 42, 42, 52, 0); drawCloud(r3, 42, 34, 56, 0);
}

addEventListener('resize', resize);
resize(); makeBg(); applyBrand(brand); basket.x = basket.tx = W/2;
document.fonts?.ready.then(drawRuleIcons);
requestAnimationFrame(loop);
</script>
</body>
