<!doctype html>
<html lang="ru" data-theme="her">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вишлист</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<!-- MAX Bridge: в браузере просто не найдёт клиент, приложение работает и без него -->
<script src="https://st.max.ru/js/max-web-app.js"></script>
<style>
/* ===== Темы ===== */
:root{
  --gap:16px;
  --font-body:'Manrope',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
html[data-theme="her"]{
  --bg:#FBF3F0; --surface:#FFFFFF; --surface-2:#F5E6E2; --line:#EBD6D0;
  --ink:#2B1B22; --ink-2:#6B5360; --ink-3:#8E7582;
  --accent:#B3365B; --accent-ink:#FFFFFF; --accent-soft:#F6DDE4; --accent-deep:#8C2445;
  --gold:#B8835C; --ok:#2F7552; --ok-soft:#DDEFE4;
  --font-display:'Playfair Display',Georgia,serif; --display-weight:700; --display-case:none; --display-track:0;
  --r-lg:26px; --r-md:18px; --r-sm:12px; --r-pill:999px;
  --shadow:0 10px 30px -12px rgba(120,40,70,.25), 0 2px 6px -2px rgba(120,40,70,.08);
  --tile-a:#F9E1E7; --tile-b:#F3D2C8; --tile-c:#EFE0F2; --tile-d:#FCE9D6;
  --tile-ink:#9B3656;
}
html[data-theme="him"]{
  --bg:#131518; --surface:#1C1F24; --surface-2:#262A30; --line:#30353C;
  --ink:#EEECE6; --ink-2:#A3A8AE; --ink-3:#8A9097;
  --accent:#E9772A; --accent-ink:#141518; --accent-soft:#3A2618; --accent-deep:#C4591A;
  --gold:#C9A46A; --ok:#7BC49A; --ok-soft:#1E3328;
  --font-display:'Oswald',Impact,sans-serif; --display-weight:600; --display-case:uppercase; --display-track:.03em;
  --r-lg:10px; --r-md:8px; --r-sm:6px; --r-pill:8px;
  --shadow:0 12px 30px -14px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.03);
  --tile-a:#23272D; --tile-b:#2A2520; --tile-c:#1F2A26; --tile-d:#2B2228;
  --tile-ink:#E9772A;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;transition:background .35s var(--ease),color .35s var(--ease)}
body{min-height:100dvh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-user-select:none;user-select:none}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
svg{display:block}
.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;padding:calc(env(safe-area-inset-top) + 12px) var(--gap) calc(env(safe-area-inset-bottom) + 120px)}
.display{font-family:var(--font-display);font-weight:var(--display-weight);text-transform:var(--display-case);letter-spacing:var(--display-track);line-height:1.08}
.muted{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}

/* ===== Кнопки ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 22px;border-radius:var(--r-pill);font-weight:700;font-size:16px;transition:transform .15s var(--ease),background .2s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.btn-primary:hover{background:var(--accent-deep)}
html[data-theme="him"] .btn-primary:hover{background:#F28A40}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-ghost:hover{background:var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-block{width:100%}
html[data-theme="him"] .btn{text-transform:uppercase;letter-spacing:.06em;font-size:15px}
.icon-btn{width:46px;height:46px;border-radius:var(--r-pill);display:grid;place-items:center;background:var(--surface-2);transition:transform .15s var(--ease),background .2s}
.icon-btn:active{transform:scale(.92)}
.icon-btn:hover{background:var(--line)}

/* ===== Переключатель темы ===== */
.seg{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:var(--r-pill);padding:4px;position:relative}
.seg button{position:relative;z-index:1;min-height:40px;padding:0 14px;font-weight:700;font-size:14px;border-radius:var(--r-pill);color:var(--ink-2);transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--accent-ink)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--accent);border-radius:var(--r-pill);transition:transform .3s var(--ease)}
.seg[data-v="him"] .thumb{transform:translateX(100%)}

/* ===== Онбординг ===== */
.onb{display:flex;flex-direction:column;min-height:calc(100dvh - 140px)}
.onb-hero{margin:28px 0 24px}
.onb-hero .display{font-size:40px}
.onb-hero p{margin-top:12px;font-size:17px;line-height:1.5;color:var(--ink-2);max-width:34ch}
.steps{display:flex;gap:6px;margin-bottom:8px}
.steps i{height:4px;flex:1;border-radius:4px;background:var(--line);transition:background .3s}
.steps i.on{background:var(--accent)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.choice button{background:var(--surface);border-radius:var(--r-lg);padding:20px 16px 18px;text-align:left;box-shadow:var(--shadow);border:2px solid transparent;transition:transform .15s var(--ease),border-color .2s}
.choice button:active{transform:scale(.97)}
.choice button[aria-pressed="true"]{border-color:var(--accent)}
.choice .sw{height:64px;border-radius:var(--r-md);margin-bottom:14px;display:flex;overflow:hidden}
.choice .sw span{flex:1}
.choice b{display:block;font-size:17px}
.choice small{display:block;margin-top:4px;color:var(--ink-2);font-size:13px;line-height:1.35}
.field{display:block;margin-top:18px}
.field span{display:block;font-size:14px;font-weight:700;color:var(--ink-2);margin-bottom:8px}
.input{width:100%;min-height:54px;padding:0 16px;border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--line);font-size:17px;transition:border-color .2s;appearance:none;-webkit-appearance:none}
.input:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border-radius:var(--r-pill);background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:15px;transition:all .2s}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check{display:flex;align-items:center;gap:12px;margin-top:20px;min-height:44px;font-size:15px;color:var(--ink-2);cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.onb-foot{margin-top:auto;padding-top:28px}

/* ===== Шапка списка ===== */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px}
.mode-pill{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border-radius:var(--r-pill);background:var(--ok-soft);color:var(--ok);font-weight:700;font-size:13px}
.hero{margin:22px 0 18px;position:relative}
.hero .kicker{font-size:15px;color:var(--ink-2);font-weight:600}
.hero h1{font-size:38px;margin-top:6px}
html[data-theme="him"] .hero h1{font-size:42px}
.hero h1 em{font-style:italic;color:var(--accent)}
html[data-theme="him"] .hero h1 em{font-style:normal}
.count{display:flex;align-items:stretch;gap:10px;margin-top:18px}
.count .box{flex:1;background:var(--surface);border-radius:var(--r-md);padding:14px 14px 12px;box-shadow:var(--shadow)}
.count .big{font-family:var(--font-display);font-weight:var(--display-weight);font-size:30px;line-height:1;color:var(--accent)}
.count .lbl{font-size:13px;color:var(--ink-2);margin-top:6px;font-weight:600}
.bar{height:6px;border-radius:6px;background:var(--surface-2);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .5s var(--ease)}

/* ===== Бюджет ===== */
.filter{margin:6px 0 14px}
.filter .lbl{font-size:14px;font-weight:700;color:var(--ink-2);margin-bottom:10px}
.filter .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--gap) * -1);padding:0 var(--gap) 4px}
.filter .chips::-webkit-scrollbar{display:none}
.filter .chip{white-space:nowrap;flex:none}

/* ===== Карточки ===== */
.list{display:flex;flex-direction:column;gap:12px}
.card{display:grid;grid-template-columns:88px 1fr;gap:14px;background:var(--surface);border-radius:var(--r-lg);padding:12px;box-shadow:var(--shadow);animation:rise .35s var(--ease) both;position:relative}
.card.taken{opacity:.62}
.tile{width:88px;height:88px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--tile-ink);position:relative;overflow:hidden}
html[data-theme="him"] .tile::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(255,255,255,.025) 10px 11px)}
.tile svg{width:38px;height:38px}
.card .body{min-width:0;display:flex;flex-direction:column}
.card .title{font-weight:700;font-size:16px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.price{font-weight:800;font-size:17px}
.shop{font-size:12px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.02em}
.shop.ozon{background:#005BFF;color:#fff}
.shop.wb{background:#A12BA6;color:#fff}
.hot{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:6px}
.hot svg{width:12px;height:12px}
.card .actions{display:flex;gap:8px;margin-top:auto;padding-top:10px;align-items:center}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.status svg{width:16px;height:16px}
.status.taken{color:var(--ok)}
.mini{white-space:nowrap;min-height:44px;padding:0 14px;border-radius:var(--r-pill);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:transform .15s var(--ease),background .2s}
.mini:active{transform:scale(.95)}
.mini svg{width:16px;height:16px}
.mini.primary{background:var(--accent);color:var(--accent-ink)}
.mini.soft{background:var(--surface-2)}
.mini.okay{background:var(--ok-soft);color:var(--ok)}
.card .del{position:absolute;top:6px;right:6px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}
.card .del:hover{background:var(--surface-2);color:var(--ink)}
.card .del svg{width:18px;height:18px}
.card.owner .title{padding-right:34px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.empty{text-align:center;padding:40px 16px 24px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.empty .ill{width:96px;height:96px;margin:0 auto 16px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.empty .ill svg{width:46px;height:46px}
.empty h3{font-size:24px}
.empty p{margin:8px auto 20px;color:var(--ink-2);max-width:28ch;line-height:1.5}

/* ===== Нижняя панель ===== */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px var(--gap) calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(to top,var(--bg) 70%,transparent)}
.dock-in{max-width:448px;margin:0 auto;display:flex;gap:10px}
.dock .btn-primary{flex:1}
.dock .add{width:54px;min-width:54px;padding:0}
.guest-note{max-width:448px;margin:0 auto 8px;text-align:center;font-size:13px;color:var(--ink-2)}

/* ===== Шторка ===== */
.scrim{position:fixed;inset:0;background:rgba(10,8,10,.5);z-index:40;opacity:0;transition:opacity .25s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:480px;margin:0 auto;background:var(--bg);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:10px var(--gap) calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .3s var(--ease);max-height:92dvh;overflow-y:auto}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:28px;margin-bottom:4px}
.sheet .sub{color:var(--ink-2);font-size:15px;line-height:1.45}
.sheet .row{display:flex;gap:10px;margin-top:22px}
.sheet .row .btn{flex:1}
.hint{font-size:13px;color:var(--ink-2);margin-top:8px;line-height:1.4;display:flex;gap:6px;align-items:flex-start}
.hint svg{width:16px;height:16px;flex:none;margin-top:1px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cats button{min-height:64px;border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2);transition:all .2s}
.cats button svg{width:22px;height:22px}
.cats button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;min-height:52px;padding:0 16px;background:var(--surface);border-radius:var(--r-md);border:1.5px solid var(--line)}
.toggle-row b{font-size:15px}
.switch{width:52px;height:30px;border-radius:30px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
.preview-tile{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:var(--r-md);padding:12px;margin-top:16px;box-shadow:var(--shadow)}
.preview-tile .tile{width:64px;height:64px}
.preview-tile .tile svg{width:28px;height:28px}

/* ===== Тост ===== */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:var(--r-pill);font-weight:700;font-size:14px;opacity:0;transition:all .25s var(--ease);z-index:60;pointer-events:none;display:flex;white-space:nowrap;align-items:center;gap:8px;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast svg{width:18px;height:18px}

/* ===== Конфетти при брони ===== */
.burst{position:fixed;pointer-events:none;z-index:70;width:8px;height:8px;border-radius:2px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* =========================================================
   ВИШЛИСТ — прототип мини-приложения для MAX
   Сейчас данные хранятся в браузере. На этапе 2 заменим
   store.load / store.save на запросы к нашему серверу.
   ========================================================= */

const MAX = window.WebApp || null;              // объект MAX Bridge (есть только внутри Max)
const inMax = !!(MAX && MAX.initData);

/* ---------- Иконки (один набор, одна толщина) ---------- */
const I = {
  gift:'<path d="M20 12v9H4v-9M2 7h20v5H2zM12 21V7M12 7H7.5a2.5 2.5 0 1 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 1 0 0-5C13 2 12 7 12 7z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  share:'<path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/>',
  cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 7H6"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  flame:'<path d="M12 22c4 0 7-3 7-7 0-5-5-7-5-12-3 2-5 5-5 8-1-1-2-2-2-4-2 2-2 5-2 8 0 4 3 7 7 7z"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  back:'<path d="M15 18l-6-6 6-6"/>',
  // категории
  tech:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M11 18h2"/>',
  wear:'<path d="M20.4 6.6 16 3a4 4 0 0 1-8 0L3.6 6.6 6 10l2-1v12h8V9l2 1z"/>',
  home:'<path d="M3 11 12 3l9 8M5 9.5V21h14V9.5M10 21v-6h4v6"/>',
  fun:'<path d="M2 9a3 3 0 0 1 0 6v3a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-3a3 3 0 0 1 0-6V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/><path d="M13 5v2M13 17v2M13 11v2"/>',
  book:'<path d="M4 19.5V5a2 2 0 0 1 2-2h14v17H6.5A2.5 2.5 0 0 0 4 22.5zM4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>',
  tool:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>'
};
const ic = (n, s='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${s}>${I[n]}</svg>`;

const CATS = [
  {id:'tech', name:'Техника', tile:'--tile-a'},
  {id:'wear', name:'Одежда',  tile:'--tile-b'},
  {id:'home', name:'Для дома',tile:'--tile-d'},
  {id:'fun',  name:'Впечатления', tile:'--tile-c'},
  {id:'book', name:'Книги',   tile:'--tile-a'},
  {id:'tool', name:'Хобби',   tile:'--tile-b'}
];
const catOf = id => CATS.find(c => c.id === id) || CATS[0];

const OCCASIONS = ['День рождения','Новый год','Свадьба','Новоселье','Просто так'];

const BUDGETS = [
  {id:'all', name:'Все', min:0, max:Infinity},
  {id:'b1',  name:'до 1 000 ₽', min:0, max:1000},
  {id:'b2',  name:'1–3 тыс.', min:1000, max:3000},
  {id:'b3',  name:'3–10 тыс.', min:3000, max:10000},
  {id:'b4',  name:'от 10 тыс.', min:10000, max:Infinity}
];

const q = s => `https://www.ozon.ru/search/?text=${encodeURIComponent(s)}`;
const DEMO = {
  her: [
    {title:'Шёлковая пижама с кантом', price:4900, cat:'wear', hot:true, link:q('шелковая пижама')},
    {title:'Сертификат в SPA на двоих', price:7500, cat:'fun', link:''},
    {title:'Ароматическая свеча с деревянным фитилём', price:1290, cat:'home', link:q('свеча деревянный фитиль'), taken:'other'},
    {title:'Беспроводные наушники', price:12990, cat:'tech', link:q('беспроводные наушники')},

const haptic = (t='light') => { try{ MAX?.HapticFeedback?.impactOccurred(t) }catch(e){} };
const hapticOk = () => { try{ MAX?.HapticFeedback?.notificationOccurred('success') }catch(e){} };
function openUrl(url){
  if (!url) return;
  if (inMax && MAX.openLink) MAX.openLink(url); else window.open(url, '_blank', 'noopener');

async function shareList(){
  haptic('medium');
  const text = `🎁 ${S.name ? 'Вишлист: ' + S.name : 'Мой вишлист'} — ${S.occasion.toLowerCase()}${S.date ? ', ' + fmtDate(S.date) : ''}.\nВыбирай подарок по своему бюджету и бронируй, чтобы не было повторов.`;
  const link = location.href.split('#')[0]; // на этапе 3: https://max.ru/<бот>?startapp=<id списка>
  try{
    if (inMax && MAX.shareMaxContent){ await MAX.shareMaxContent({text, link}); return; }
    if (navigator.share){ await navigator.share({text, url:link}); return; }
    await navigator.clipboard.writeText(text + '\n' + link);
    toast('Ссылка скопирована', 'check');
  }catch(e){ /* пользователь закрыл окно — это нормально */ }
}

/* ---------- Утилиты ---------- */
const rub = n => new Intl.NumberFormat('ru-RU').format(n) + ' ₽';
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(d){ return new Date(d + 'T00:00').toLocaleDateString('ru-RU', {day:'numeric', month:'long'}); }
function daysLeft(d){
  if (!d) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  let t = new Date(d + 'T00:00');
  if (S.occasion === 'День рождения'){ t.setFullYear(now.getFullYear()); if (t < now) t.setFullYear(now.getFullYear() + 1); }
  return Math.round((t - now) / 864e5);
}
function shopOf(link){
  if (/ozon\.ru/i.test(link)) return {cls:'ozon', name:'OZON'};
  if (/wildberries\.ru|wb\.ru/i.test(link)) return {cls:'wb', name:'WB'};
  return null;
}
function setTheme(t){
  S.theme = t; document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]')?.remove();
  save();
}

function card(it, owner, n){
  const c = catOf(it.cat);
  const shop = shopOf(it.link || '');
  const tile = `<div class="tile" style="background:var(${c.tile})" aria-hidden="true">${ic(c.id)}</div>`;
  const meta = `<div class="meta">

      ${shop ? `<span class="shop ${shop.cls}">${shop.name}</span>` : ''}
      ${it.hot ? `<span class="hot">${ic('flame')} Очень хочу</span>` : ''}
    </div>`;
  let actions = '';
  if (owner){
    actions = it.taken
      ? `<span class="status taken">${ic('lock')} Кто-то уже дарит</span>`
      : `<span class="status">${ic('gift')} Ждёт дарителя</span>`;
  } else if (it.taken === 'me'){
    actions = `<button class="mini okay" data-act="unbook" data-id="${it.id}">${ic('check')} Вы дарите</button>
      ${it.link ? `<button class="mini soft" data-act="buy" data-id="${it.id}" aria-label="Купить в магазине">${ic('cart')}</button>` : ''}`;
  } else if (it.taken){
    actions = `<span class="status">${ic('lock')} Уже кто-то дарит</span>`;
  } else {
    actions = `<button class="mini primary" data-act="book" data-id="${it.id}">${ic('gift')} Подарю это</button>
      ${it.link ? `<button class="mini soft" data-act="buy" data-id="${it.id}" aria-label="Открыть в магазине">${ic('cart')}</button>` : ''}`;
  }
  return `<article class="card ${owner ? 'owner' : ''} ${!owner && it.taken && it.taken !== 'me' ? 'taken' : ''}" style="animation-delay:${Math.min(n,8)*40}ms">
    ${tile}
    <div class="body">
      <div class="title">${esc(it.title)}</div>
      ${meta}
      <div class="actions">${actions}</div>
    </div>
    ${owner ? `<button class="del" data-act="del" data-id="${it.id}" aria-label="Удалить">${ic('trash')}</button>` : ''}
  </article>`;
}

  if (S.screen === 'onb' && S.step === 2){ S.step = 1; save(); render(); }

function syncBack(){
  try{
    if (!MAX?.BackButton) return;
    const need = sheetOpen || (S.screen === 'list' && S.mode === 'guest') || (S.screen === 'onb' && S.step === 2);
    need ? MAX.BackButton.show() : MAX.BackButton.hide();
  }catch(e){}

/* ---------- Тост и праздник ---------- */
let tt;
function toast(msg, icon){
  const t = document.getElementById('toast');
  t.innerHTML = (icon ? ic(icon) : '') + esc(msg);
  t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200);
}
function burst(x, y){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = getComputedStyle(document.documentElement);
  const pal = [colors.getPropertyValue('--accent'), colors.getPropertyValue('--gold'), colors.getPropertyValue('--ok')];
  for (let i = 0; i < 18; i++){
    const p = document.createElement('div'); p.className = 'burst';
    p.style.background = pal[i % 3]; p.style.left = x + 'px'; p.style.top = y + 'px';
    document.body.appendChild(p);
    const a = Math.random() * Math.PI * 2, r = 50 + Math.random() * 70;
    p.animate([{transform:'translate(0,0) rotate(0)', opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r - 30}px) rotate(${Math.random()*360}deg)`, opacity:0}],
      {duration:700 + Math.random()*300, easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish = () => p.remove();
  }
}

/* ---------- Действия ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v, id = b.dataset.id;
  const it = id ? S.items.find(x => x.id === id) : null;

  switch(act){
    case 'theme': haptic('soft'); setTheme(v); render(); break;
    case 'next': haptic(); S.step = 2; save(); render(); break;
    case 'prev': haptic(); S.step = 1; save(); render(); break;
    case 'occ': haptic('soft'); S.name = document.getElementById('f-name').value; S.date = document.getElementById('f-date').value; S.occasion = v; render(); break;
    case 'create': {
      S.name = document.getElementById('f-name').value.trim();
      S.date = document.getElementById('f-date').value;
      S.demo = document.getElementById('f-demo').checked;
      S.items = S.demo ? DEMO[S.theme].map(x => ({...x, id:uid()})) : [];
      S.screen = 'list'; S.mode = 'owner'; hapticOk(); save(); render();
      window.scrollTo(0,0);
      break;
    }
    case 'mode': haptic(); S.mode = S.mode === 'owner' ? 'guest' : 'owner'; S.budget = 'all'; save(); render(); window.scrollTo({top:0, behavior:'smooth'}); break;
    case 'budget': haptic('soft'); S.budget = v; save(); render(); break;
    case 'add': haptic(); openAdd(); break;
    case 'share': shareList(); break;
    case 'close': closeSheet(); break;
    case 'cat': haptic('soft'); draft.cat = v; $sheet.querySelectorAll('[data-act=cat]').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === v)); break;
    case 'hot': { haptic('soft'); draft.hot = !draft.hot; document.getElementById('a-hot').setAttribute('aria-checked', draft.hot); break; }
    case 'saveItem': {
      if (!draft.title || !draft.price) return;
      S.items.unshift({id:uid(), title:draft.title, price:draft.price, link:draft.link, cat:draft.cat, hot:draft.hot});
      save(); closeSheet(); render(); hapticOk(); toast('Желание добавлено', 'check');
      break;
    }
    case 'book': haptic(); openBook(it); break;
    case 'confirmBook': {
      it.taken = 'me'; save(); closeSheet(); render(); hapticOk();
      const el = document.querySelector(`[data-act="unbook"][data-id="${id}"]`);
      if (el){ const r = el.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2); }
      toast('Отлично! Подарок за вами', 'gift');
      break;
    }
    case 'unbook': haptic(); delete it.taken; save(); render(); toast('Бронь снята'); break;
    case 'buy': haptic(); openUrl(it.link); break;
    case 'del': haptic(); openDel(it); break;
    case 'confirmDel': S.items = S.items.filter(x => x.id !== id); save(); closeSheet(); render(); toast('Удалено'); break;
  }
});

/* Сброс прототипа: добавь #reset к адресу */
if (location.hash === '#reset'){ try{ localStorage.removeItem(KEY) }catch(e){} location.hash = ''; location.reload(); }

render();
</script>
</body>
</html>
