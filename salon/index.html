<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Салон «Лиса» — онлайн-запись</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://st.max.ru/js/max-web-app.js"></script>
<style>
/* Салон: тёплый беж, терракота и глубокий сливовый; мягкий объём */
:root{
  --bg:#F7F1EC; --surface:#FFFFFF; --surface2:#F1E7E0; --line:#E6D8CE;
  --ink:#2B1D24; --ink2:#6F5A63; --ink3:#9A8790;
  --accent:#8E3B55; --accent2:#C9677F; --accent-soft:#F6E1E7; --gold:#C9A06A;
  --ok:#2E7A57; --ok-soft:#DFF1E7;
  --display:'Cormorant Garamond',Georgia,serif; --body:'Manrope',system-ui,sans-serif;
  --r:22px; --r-sm:14px;
  --shadow:0 18px 30px -18px rgba(90,40,60,.35), 0 3px 8px -4px rgba(90,40,60,.12), inset 0 1px 0 #fff;
  --btn:linear-gradient(180deg,#B5566F 0%,#8E3B55 100%);
  --btn-shadow:0 14px 22px -12px rgba(142,59,85,.8), inset 0 2px 0 rgba(255,255,255,.3), inset 0 -4px 8px rgba(60,10,30,.25);
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:radial-gradient(80% 40% at 100% 0%,#F6E1E7 0,rgba(246,225,231,0) 70%),radial-gradient(70% 35% at 0% 30%,#F3E6D6 0,rgba(243,230,214,0) 70%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100dvh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
svg{display:block}
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 120px)}
.display{font-family:var(--display);font-weight:700;letter-spacing:.005em;line-height:1.02}
.num{font-variant-numeric:tabular-nums}

/* Шапка */
.top{display:flex;align-items:center;gap:10px;min-height:48px}
.back{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);transition:transform .15s var(--spring)}
.back:active{transform:scale(.92)}
.back[hidden]{display:none}
.steps{flex:1;display:flex;gap:5px}
.steps i{height:5px;flex:1;border-radius:5px;background:var(--line);transition:background .3s}
.steps i.on{background:var(--accent)}

.hero{display:flex;gap:14px;align-items:center;margin:14px 0 18px}
.mark{width:64px;height:64px;border-radius:20px;flex:none;display:grid;place-items:center;background:var(--btn);color:#fff;font-family:var(--display);font-size:34px;font-weight:700;box-shadow:var(--btn-shadow)}
.hero h1{font-size:34px}
.hero .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;font-size:13px;color:var(--ink2);font-weight:700}
.hero .meta span{display:inline-flex;align-items:center;gap:4px}
.hero .meta svg{width:14px;height:14px}
.star{color:var(--gold)}

h2{font-size:30px;margin:6px 0 4px}
.sub{color:var(--ink2);font-size:15px;line-height:1.45;margin-bottom:14px}

/* Категории */
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:2px 16px 8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:42px;padding:0 16px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:700;font-size:14px;color:var(--ink2);transition:all .2s}
.tab[aria-pressed="true"]{background:var(--ink);color:#fff}

/* Список услуг */
.list{display:flex;flex-direction:column;gap:10px}
.svc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border-radius:var(--r);padding:14px 14px 14px 16px;box-shadow:var(--shadow);outline:2px solid transparent;outline-offset:-2px;transition:transform .15s var(--spring),outline-color .2s}
.svc:active{transform:scale(.98)}
.svc[aria-pressed="true"]{outline-color:var(--accent)}
.svc .txt{flex:1;min-width:0}
.svc b{display:block;font-size:16px;line-height:1.3}
.svc small{display:block;color:var(--ink2);font-size:13px;margin-top:3px;font-weight:600}
.svc .price{font-weight:800;font-size:16px;white-space:nowrap}
.tick{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--line);transition:all .2s var(--spring)}
.tick svg{width:16px;height:16px;opacity:0;transform:scale(.4);transition:all .2s var(--spring)}
[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:#fff}
[aria-pressed="true"] .tick svg{opacity:1;transform:none}

/* Мастера */
.masters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mst{background:var(--surface);border-radius:var(--r);padding:16px 12px 14px;box-shadow:var(--shadow);text-align:center;outline:2px solid transparent;outline-offset:-2px;transition:transform .15s var(--spring),outline-color .2s}
.mst:active{transform:scale(.97)}
.mst[aria-pressed="true"]{outline-color:var(--accent)}
.ava{width:68px;height:68px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-family:var(--display);font-size:30px;font-weight:700;color:#fff;box-shadow:inset 0 -6px 12px rgba(0,0,0,.15),0 8px 14px -8px rgba(0,0,0,.35)}
.mst b{display:block;font-size:16px}
.mst small{display:block;color:var(--ink2);font-size:12px;font-weight:700;margin-top:2px}
.mst .rt{display:inline-flex;align-items:center;gap:3px;margin-top:6px;font-size:12px;font-weight:800;color:var(--ink2)}
.mst .rt svg{width:12px;height:12px}
.mst.any .ava{background:var(--surface2);color:var(--accent)}
.mst.any .ava svg{width:30px;height:30px}

/* Дата и время */
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 16px;padding:4px 16px 12px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:58px;min-height:74px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .2s var(--spring)}
.day small{font-size:12px;font-weight:800;color:var(--ink3);text-transform:uppercase}
.day b{font-size:22px;font-weight:800}
.day.off{opacity:.4;pointer-events:none}
.day[aria-pressed="true"]{background:var(--ink);color:#fff}
.day[aria-pressed="true"] small{color:rgba(255,255,255,.7)}
.slots-h{font-size:13px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 8px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.slot{min-height:46px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-weight:800;font-size:15px;transition:all .15s var(--spring)}
.slot:active{transform:scale(.94)}
.slot:disabled{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink3);text-decoration:line-through;cursor:default}
.slot[aria-pressed="true"]{background:var(--accent);color:#fff}

/* Форма */
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:14px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.input{width:100%;min-height:54px;padding:0 16px;border-radius:var(--r-sm);background:var(--surface);border:1.5px solid var(--line);font-size:17px;transition:border-color .2s,box-shadow .2s;appearance:none;-webkit-appearance:none}
textarea.input{min-height:90px;padding:14px 16px;resize:none;line-height:1.4}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.err{color:#B3261E;font-size:13px;font-weight:700;margin-top:6px;display:none}
.field.bad .input{border-color:#B3261E}
.field.bad .err{display:block}

.summary{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:6px 16px;margin-bottom:14px}
.summary .li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.summary .li:last-child{border-bottom:0}
.summary .li span{color:var(--ink2);font-weight:600}
.summary .li b{text-align:right;font-weight:800}
.summary .total b{font-size:18px;color:var(--accent)}

/* Готово */
.done{text-align:center;padding-top:26px}
.done .ok{width:96px;height:96px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);box-shadow:0 18px 30px -16px rgba(46,122,87,.6);animation:pop .5s var(--spring)}
.done .ok svg{width:46px;height:46px}
.done h2{font-size:36px}
.done .sub{max-width:30ch;margin:6px auto 18px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}

/* Низ */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:14px 16px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(to top,var(--bg) 65%,rgba(247,241,236,0))}
.dock-in{max-width:448px;margin:0 auto}
.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:58px;border-radius:999px;padding:0 22px;font-weight:800;font-size:16px;color:#fff;background:var(--btn);box-shadow:var(--btn-shadow);transition:transform .15s var(--spring),opacity .2s}
.btn.center{justify-content:center}
.btn:active{transform:translateY(2px) scale(.98)}
.btn[disabled]{opacity:.45;pointer-events:none;filter:saturate(.5)}
.btn .sum{font-variant-numeric:tabular-nums;opacity:.95}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.fade{animation:fade .35s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.demo-note{margin-top:18px;text-align:center;font-size:12px;color:var(--ink3);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="dock" id="dock"><div class="dock-in"><button class="btn" id="cta"></button></div></div>

<script>
/* =========================================================
   Мини-приложение записи в салон (демо для портфолио).
   Данные — примеры. В рабочей версии услуги, мастера и
   свободное время берутся с сервера или из CRM салона.
   ========================================================= */
const SALON = { name:'Лиса', letter:'Л', rating:'4,9', reviews:312, address:'ул. Садовая, 12' };
const CATS = ['Маникюр','Педикюр','Волосы','Брови и ресницы'];
const SERVICES = [
  {id:1, cat:'Маникюр', name:'Маникюр с покрытием гель-лак', min:90, price:2200},
  {id:2, cat:'Маникюр', name:'Маникюр без покрытия', min:45, price:1200},
  {id:3, cat:'Маникюр', name:'Дизайн (1–2 ногтя)', min:15, price:300},
  {id:4, cat:'Педикюр', name:'Педикюр с покрытием', min:100, price:2800},
  {id:5, cat:'Педикюр', name:'Педикюр smart', min:60, price:2000},
  {id:6, cat:'Волосы', name:'Женская стрижка', min:60, price:2500},
  {id:7, cat:'Волосы', name:'Окрашивание в один тон', min:120, price:4800},
  {id:8, cat:'Волосы', name:'Укладка', min:45, price:1500},
  {id:9, cat:'Брови и ресницы', name:'Коррекция и окрашивание бровей', min:40, price:1300},
  {id:10, cat:'Брови и ресницы', name:'Ламинирование ресниц', min:60, price:2400}
];
const MASTERS = [
  {id:'a', name:'Алина', role:'Топ-мастер', rating:'5,0', color:'linear-gradient(160deg,#E7A0B2,#A64A66)', cats:['Маникюр','Педикюр']},
  {id:'k', name:'Ксения', role:'Мастер', rating:'4,9', color:'linear-gradient(160deg,#E4C29A,#A97A45)', cats:['Маникюр','Брови и ресницы']},
  {id:'v', name:'Вера', role:'Стилист', rating:'4,9', color:'linear-gradient(160deg,#B7A7D9,#6C5A9E)', cats:['Волосы']},
  {id:'d', name:'Дарья', role:'Мастер', rating:'4,8', color:'linear-gradient(160deg,#9CC9B3,#3F7E62)', cats:['Педикюр','Брови и ресницы','Волосы']}
];

const MAX = window.WebApp || null;
const haptic = t => { try{ MAX?.HapticFeedback?.impactOccurred(t) }catch(e){} };
const hapticOk = () => { try{ MAX?.HapticFeedback?.notificationOccurred('success') }catch(e){} };

const I = {
  back:'<path d="M15 18l-6-6 6-6"/>', check:'<path d="M20 6 9 17l-5-5"/>',
  star:'<path d="m12 2 3 6.5 7 .8-5.2 4.8 1.4 7L12 17.8 5.8 21l1.4-7L2 9.3l7-.8z" fill="currentColor" stroke="none"/>',
  pin:'<path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>'
};
const ic = (n, a='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${a}>${I[n]}</svg>`;
const rub = n => new Intl.NumberFormat('ru-RU').format(n) + ' ₽';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural = (n, a, b, c) => { const m10 = n%10, m100 = n%100; return m10===1&&m100!==11 ? a : (m10>=2&&m10<=4&&(m100<10||m100>=20) ? b : c); };
const dur = m => m >= 60 ? `${Math.floor(m/60)} ч${m%60 ? ' ' + m%60 + ' мин' : ''}` : `${m} мин`;

const S = { step:0, cat:CATS[0], picked:[], master:null, day:null, time:null, name:'', phone:'', note:'' };
try{ const u = MAX?.initDataUnsafe?.user; if (u?.first_name) S.name = u.first_name; }catch(e){}

const picked = () => SERVICES.filter(s => S.picked.includes(s.id));
const total = () => picked().reduce((a, s) => a + s.price, 0);
const totalMin = () => picked().reduce((a, s) => a + s.min, 0);

const dkey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
/* Детерминированно «занятые» слоты, чтобы демо выглядело живым */
function days(){
  const out = [], wd = ['вс','пн','вт','ср','чт','пт','сб'], now = new Date(); now.setHours(0,0,0,0);
  for (let i = 0; i < 14; i++){ const d = new Date(now); d.setDate(now.getDate() + i); out.push({ key: dkey(d), d, wd: i === 0 ? 'сег' : i === 1 ? 'зав' : wd[d.getDay()], num: d.getDate(), off: d.getDay() === 1 && i > 1 }); }
  return out;
}
function slots(dayKey){
  const list = []; let seed = [...dayKey + (S.master || 'x')].reduce((a, c) => a + c.charCodeAt(0), 0);
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const nowH = new Date().getHours() + new Date().getMinutes()/60, today = dayKey === dkey(new Date());
  for (let h = 10; h <= 20; h++) for (const m of [0, 30]){ if (h === 20 && m) continue; const t = h + m/60; list.push({ t: `${h}:${m ? '30' : '00'}`, busy: rnd() < .35 || (today && t <= nowH + .5) }); }
  return list;
}

/* ---------- Экраны ---------- */
const $app = document.getElementById('app'), $cta = document.getElementById('cta');
const STEP_N = 4;

function header(){
  return `<div class="top">
    <button class="back" data-act="back" aria-label="Назад" ${S.step === 0 || S.step === 4 ? 'hidden' : ''}>${ic('back','width="22" height="22"')}</button>
    <div class="steps" aria-label="Шаг ${Math.min(S.step+1, STEP_N)} из ${STEP_N}">${Array.from({length:STEP_N}, (_, i) => `<i class="${i <= S.step ? 'on' : ''}"></i>`).join('')}</div>
  </div>`;
}

function render(){
  const v = [screen0, screen1, screen2, screen3, screen4][S.step]();
  const stepChanged = render.last !== S.step; render.last = S.step;
  $app.innerHTML = header() + `<div class="${stepChanged ? 'fade' : ''}">${v}</div>`;
  cta(); syncBack();
}

function screen0(){
  return `<section class="hero">
      <div class="mark">${SALON.letter}</div>
      <div><h1 class="display">Салон «${SALON.name}»</h1>
        <div class="meta"><span><span class="star">${ic('star','width="14" height="14"')}</span>${SALON.rating} · ${SALON.reviews} отзывов</span><span>${ic('pin')}${SALON.address}</span></div></div>
    </section>
    <h2 class="display">Что делаем?</h2>
    <p class="sub">Выберите одну или несколько услуг — посчитаем время и сумму.</p>
    <div class="tabs" role="tablist">${CATS.map(c => `<button class="tab" data-act="cat" data-v="${c}" aria-pressed="${S.cat === c}">${c}</button>`).join('')}</div>
    <div class="list">${SERVICES.filter(s => s.cat === S.cat).map(s => `
      <button class="svc" data-act="svc" data-id="${s.id}" aria-pressed="${S.picked.includes(s.id)}">
        <span class="tick">${ic('check')}</span>
        <span class="txt"><b>${s.name}</b><small>${dur(s.min)}</small></span>
        <span class="price num">${rub(s.price)}</span>
      </button>`).join('')}</div>
    <p class="demo-note">Демо-версия: салон и цены вымышленные</p>`;
}
function screen1(){
  const cats = [...new Set(picked().map(s => s.cat))];
  const fit = MASTERS.filter(m => cats.every(c => m.cats.includes(c)));
  const list = fit.length ? fit : MASTERS;
  return `<h2 class="display">Кто вас примет?</h2>
    <p class="sub">${fit.length ? 'Показываем мастеров, которые делают все выбранные услуги.' : 'Под все услуги сразу мастера нет — выберите любого, администратор распределит.'}</p>
    <div class="masters">
      <button class="mst any" data-act="master" data-id="any" aria-pressed="${S.master === 'any'}"><div class="ava">${ic('users')}</div><b>Любой</b><small>Ближайшее время</small></button>
      ${list.map(m => `<button class="mst" data-act="master" data-id="${m.id}" aria-pressed="${S.master === m.id}">
        <div class="ava" style="background:${m.color}">${m.name[0]}</div><b>${m.name}</b><small>${m.role}</small>
        <span class="rt"><span class="star">${ic('star')}</span>${m.rating}</span></button>`).join('')}
    </div>`;
}
function screen2(){
  const ds = days();
  // по умолчанию — первый рабочий день, где есть свободные окна (поздно вечером «сегодня» уже пусто)
  if (!S.day) S.day = (ds.find(d => !d.off && slots(d.key).some(x => !x.busy)) || ds[0]).key;
  const sl = slots(S.day), free = sl.filter(s => !s.busy).length;
  return `<h2 class="display">Когда удобно?</h2>
    <p class="sub">Длительность визита — ${dur(totalMin())}.</p>
    <div class="days">${ds.map(d => `<button class="day ${d.off ? 'off' : ''}" data-act="day" data-v="${d.key}" aria-pressed="${S.day === d.key}" ${d.off ? 'aria-disabled="true"' : ''}><small>${d.wd}</small><b class="num">${d.num}</b></button>`).join('')}</div>
    <div class="slots-h">${free ? `Свободно ${free} ${plural(free,'окно','окна','окон')}` : 'На этот день мест нет'}</div>
    <div class="slots">${sl.map(s => `<button class="slot num" data-act="time" data-v="${s.t}" aria-pressed="${S.time === s.t}" ${s.busy ? 'disabled' : ''}>${s.t}</button>`).join('')}</div>`;
}
function screen3(){
  const m = S.master === 'any' ? 'Любой мастер' : MASTERS.find(x => x.id === S.master)?.name;
  const d = new Date(S.day + 'T00:00').toLocaleDateString('ru-RU', {day:'numeric', month:'long', weekday:'short'});
  return `<h2 class="display">Почти готово</h2>
    <p class="sub">Проверьте запись и оставьте контакт — подтвердим сообщением.</p>
    <div class="summary">
      <div class="li"><span>Услуги</span><b>${picked().map(s => esc(s.name)).join('<br>')}</b></div>
      <div class="li"><span>Мастер</span><b>${esc(m)}</b></div>
      <div class="li"><span>Когда</span><b>${d}, ${S.time}</b></div>
      <div class="li total"><span>Итого</span><b class="num">${rub(total())}</b></div>
    </div>
    <label class="field" id="fName"><span>Имя</span><input class="input" id="name" autocomplete="given-name" maxlength="40" value="${esc(S.name)}" placeholder="Как к вам обращаться"><div class="err">Напишите имя</div></label>
    <label class="field" id="fPhone"><span>Телефон</span><input class="input num" id="phone" type="tel" inputmode="tel" autocomplete="tel" value="${esc(S.phone)}" placeholder="+7 (900) 000-00-00"><div class="err">Проверьте номер: нужно 10 цифр после +7</div></label>
    <label class="field"><span>Пожелания (необязательно)</span><textarea class="input" id="note" maxlength="300" placeholder="Например, дизайн как на фото">${esc(S.note)}</textarea></label>`;
}
function screen4(){
  const m = S.master === 'any' ? 'любой свободный' : MASTERS.find(x => x.id === S.master)?.name;
  const d = new Date(S.day + 'T00:00').toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
  return `<div class="done">
    <div class="ok">${ic('check')}</div>
    <h2 class="display">Вы записаны!</h2>
    <p class="sub">${esc(S.name)}, ждём вас ${d} в ${S.time}. Мастер — ${esc(m)}. Напомним за день и за 2 часа.</p>
    <div class="summary" style="text-align:left">
      <div class="li"><span>${ic('clock','width="16" height="16" style="display:inline;vertical-align:-3px"')} Время визита</span><b>${dur(totalMin())}</b></div>
      <div class="li"><span>${ic('pin','width="16" height="16" style="display:inline;vertical-align:-3px"')} Адрес</span><b>${SALON.address}</b></div>
      <div class="li total"><span>К оплате в салоне</span><b class="num">${rub(total())}</b></div>
    </div>
  </div>`;
}

function cta(){
  let text = '', dis = false, sum = '';
  if (S.step === 0){ const n = S.picked.length; text = n ? `Выбрать мастера` : 'Выберите услугу'; dis = !n; sum = n ? rub(total()) : ''; }
  if (S.step === 1){ text = 'Выбрать время'; dis = !S.master; }
  if (S.step === 2){ text = S.time ? `Дальше · ${S.time}` : 'Выберите время'; dis = !S.time; }
  if (S.step === 3){ text = 'Записаться'; sum = rub(total()); }
  if (S.step === 4){ text = 'Записаться ещё'; }
  $cta.disabled = dis;
  $cta.className = 'btn' + (sum ? '' : ' center') + (S.step === 4 ? ' ghost' : '');
  $cta.innerHTML = sum ? `<span>${text}</span><span class="sum">${sum}</span>` : `<span>${text}</span>`;
}

function formatPhone(v){
  let d = v.replace(/\D/g, ''); if (d.startsWith('8')) d = '7' + d.slice(1); if (!d.startsWith('7')) d = '7' + d; d = d.slice(0, 11);
  const p = d.slice(1); let out = '+7';
  if (p.length) out += ' (' + p.slice(0,3); if (p.length >= 3) out += ')'; if (p.length > 3) out += ' ' + p.slice(3,6);
  if (p.length > 6) out += '-' + p.slice(6,8); if (p.length > 8) out += '-' + p.slice(8,10);
  return out;
}

function go(step){ S.step = step; render(); window.scrollTo({top:0}); }
function onBack(){ if (S.step > 0 && S.step < 4){ haptic('light'); go(S.step - 1); } }
function syncBack(){ try{ if (!MAX?.BackButton) return; (S.step > 0 && S.step < 4) ? MAX.BackButton.show() : MAX.BackButton.hide(); }catch(e){} }
try{ MAX?.BackButton?.onClick(onBack) }catch(e){}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'back') return onBack();
  if (a === 'cat'){ haptic('soft'); S.cat = b.dataset.v; render(); }
  if (a === 'svc'){ haptic('light'); const id = +b.dataset.id; S.picked = S.picked.includes(id) ? S.picked.filter(x => x !== id) : [...S.picked, id]; S.master = null; S.time = null; render(); }
  if (a === 'master'){ haptic('light'); S.master = b.dataset.id; S.time = null; render(); }
  if (a === 'day'){ haptic('soft'); S.day = b.dataset.v; S.time = null; render(); }
  if (a === 'time'){ haptic('light'); S.time = b.dataset.v; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'name'){ S.name = e.target.value; document.getElementById('fName').classList.remove('bad'); }
  if (e.target.id === 'phone'){ e.target.value = formatPhone(e.target.value); S.phone = e.target.value; document.getElementById('fPhone').classList.remove('bad'); }
  if (e.target.id === 'note') S.note = e.target.value;
});
$cta.addEventListener('click', () => {
  if (S.step < 3){ haptic('medium'); return go(S.step + 1); }
  if (S.step === 3){
    const okName = S.name.trim().length > 0, okPhone = S.phone.replace(/\D/g,'').length === 11;
    document.getElementById('fName').classList.toggle('bad', !okName);
    document.getElementById('fPhone').classList.toggle('bad', !okPhone);
    if (!okName || !okPhone){ try{ MAX?.HapticFeedback?.notificationOccurred('error') }catch(e){} return; }
    hapticOk(); return go(4);
  }
  if (S.step === 4){ Object.assign(S, {picked:[], master:null, day:null, time:null, note:''}); go(0); }
});

render();
</script>
</body>
</html>
